name: Desktop Hardening Tests

on:
  push:
    branches: [ main, hardening, 'feat/**', 'fix/**' ]
  pull_request:
    branches: [ main, hardening ]

jobs:
  test:
    name: Desktop Validation Suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify diff hygiene
        run: |
          set -e
          BASE_COMMIT=""

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_REF="origin/${{ github.base_ref }}"
            if git rev-parse --verify "$BASE_REF" >/dev/null 2>&1; then
              BASE_COMMIT=$(git merge-base HEAD "$BASE_REF")
            fi
          else
            BEFORE="${{ github.event.before }}"
            if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
              if ! git rev-parse --verify "${BEFORE}^{commit}" >/dev/null 2>&1; then
                git fetch origin "$BEFORE" >/dev/null 2>&1 || true
              fi
              if git rev-parse --verify "${BEFORE}^{commit}" >/dev/null 2>&1; then
                BASE_COMMIT="$BEFORE"
              fi
            fi

            if [ -z "$BASE_COMMIT" ]; then
              CURRENT_BRANCH="${{ github.ref_name }}"
              MIN_DISTANCE=""
              for CANDIDATE in "origin/hardening" "origin/main"; do
                if [ "$CURRENT_BRANCH" != "${CANDIDATE#origin/}" ] && git rev-parse --verify "$CANDIDATE" >/dev/null 2>&1; then
                  MB=$(git merge-base HEAD "$CANDIDATE" 2>/dev/null || true)
                  if [ -n "$MB" ]; then
                    DIST=$(git rev-list --count "${MB}..HEAD" 2>/dev/null || true)
                    if [ -n "$DIST" ]; then
                      if [ -z "$MIN_DISTANCE" ] || [ "$DIST" -lt "$MIN_DISTANCE" ]; then
                        MIN_DISTANCE="$DIST"
                        BASE_COMMIT="$MB"
                      fi
                    fi
                  fi
                fi
              done
            fi
          fi

          if [ -z "$BASE_COMMIT" ]; then
            if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
              BASE_COMMIT="HEAD~1"
            else
              BASE_COMMIT="4b825dc642cb6eb9a060e54bf8d69288fbee4904"
            fi
          fi

          echo "Verifying diff hygiene between $BASE_COMMIT and HEAD"
          git diff --check "${BASE_COMMIT}..HEAD"

      - name: Build and run combined test runner (C++17, Warnings-as-Errors)
        run: |
          clang++ -std=c++17 -Wall -Wextra -Werror -pedantic \
            -Icommon -Imerger-app -Isplitter -Itests \
            tests/test_runner.cpp tests/test_crypto_manifest.cpp \
            common/*.cpp merger-app/merger_core.cpp splitter/splitter_core.cpp \
            -o tests/test_runner
          ./tests/test_runner

      - name: Build and run standalone merger tests
        run: |
          clang++ -std=c++17 -Wall -Wextra -Werror -pedantic \
            -Icommon -Imerger-app -Itests \
            tests/test_merger_core.cpp merger-app/merger_core.cpp common/*.cpp \
            -o tests/test_merger_runner
          ./tests/test_merger_runner

      - name: Build and run standalone splitter tests
        run: |
          clang++ -std=c++17 -Wall -Wextra -Werror -pedantic \
            -Icommon -Isplitter -Itests \
            tests/test_splitter_core.cpp splitter/splitter_core.cpp common/*.cpp \
            -o tests/test_splitter_runner
          ./tests/test_splitter_runner

      - name: Build and run under Sanitizers (ASan + UBSan)
        run: |
          clang++ -std=c++17 -fsanitize=address,undefined -g -O1 \
            -Icommon -Imerger-app -Isplitter -Itests \
            tests/test_runner.cpp tests/test_crypto_manifest.cpp \
            common/*.cpp merger-app/merger_core.cpp splitter/splitter_core.cpp \
            -o tests/test_runner_sanitized
          ./tests/test_runner_sanitized

      - name: Build Splitter CLI with CMake
        run: |
          cd splitter
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release
          ./build/splitter -v || ./build/splitter 2>&1 | grep -i "Usage"

      - name: Build and run multi-GB integration test
        run: |
          clang++ -std=c++17 -O2 -Wall -Wextra -Werror \
            -Icommon -Imerger-app -Isplitter -Itests \
            tests/test_large_file_integration.cpp \
            common/*.cpp merger-app/merger_core.cpp splitter/splitter_core.cpp \
            -o tests/test_large_file_runner
          ./tests/test_large_file_runner

      - name: Verify release checksum generator script
        run: |
          mkdir -p dist_test
          cp splitter/build/splitter dist_test/
          ./scripts/generate_release_checksums.sh dist_test
          test -f dist_test/SHA256SUMS.txt
          cat dist_test/SHA256SUMS.txt
          rm -rf dist_test
